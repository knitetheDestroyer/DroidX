name: Build Bionic Tools

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-bash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y bison texinfo autoconf automake libtool

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Download and extract GNU Bash 5.2
        run: |
          wget https://ftp.gnu.org/gnu/bash/bash-5.2.tar.gz
          tar -xzf bash-5.2.tar.gz

      - name: Patch default PATH
        run: |
          cd bash-5.2
          echo '#undef DEFAULT_PATH_VALUE' >> config-top.h
          echo '#define DEFAULT_PATH_VALUE "/data/data/com.custom.terminal/files/usr/bin:/system/bin"' >> config-top.h
          sed -i '1i#include <unistd.h>' lib/termcap/tparam.c lib/termcap/termcap.c

      - name: Configure and Build
        run: |
          cd bash-5.2

          # NDK setup for cross compilation
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=34

          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export AS=$CC
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip

          export CFLAGS="-O2 -fPIE -Wno-error=implicit-function-declaration"
          export LDFLAGS="-static -pie"

          export ac_cv_func_setvbuf_reversed=no
          export ac_cv_c_bigendian=no
          export bash_cv_have_mbstate_t=yes
          export bash_cv_func_sigsetjmp=present
          export bash_cv_getcwd_malloc=yes
          export bash_cv_job_control_missing=present
          export bash_cv_strtoimax_missing=no
          export ac_cv_func_strtoimax=yes

          CC="${CC}" CFLAGS="-O2 -fPIE -Wno-error=implicit-function-declaration" LDFLAGS="-static -pie" CC_FOR_BUILD=gcc ./configure \
            --host=aarch64-linux-android \
            --target=aarch64-linux-android \
            --prefix=/data/data/com.custom.terminal/files/usr \
            --enable-static-link \
            --without-bash-malloc \
            --disable-nls

          make CC_FOR_BUILD=gcc -j$(nproc)
          $STRIP --strip-all bash

      - name: Package binary
        run: |
          mkdir -p output
          cp bash-5.2/bash output/
          cd output
          tar -czvf bash-arm64.tar.gz bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidx-bionic-bash-arm64
          path: output/bash-arm64.tar.gz
