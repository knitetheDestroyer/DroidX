name: Build Bionic Tools

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-git:
    name: Build Pure Static Git 2.47.1 (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Download zlib, PCRE2, and Git
        run: |
          wget -q https://zlib.net/zlib-1.3.1.tar.gz || wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar -xzf zlib-1.3.1.tar.gz
          wget -q https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.bz2
          tar -xjf pcre2-10.44.tar.bz2
          wget -q https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.47.1.tar.xz
          tar -xf git-2.47.1.tar.xz

      - name: Build Static zlib
        run: |
          cd zlib-1.3.1
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export PATH=$TOOLCHAIN/bin:$PATH
          export CC=aarch64-linux-android34-clang
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          CFLAGS="-O2 -static -fPIE -Wl,-z,max-page-size=16384" ./configure --static --prefix=$GITHUB_WORKSPACE/deps-install
          make -j$(nproc)
          make install

      - name: Build Static PCRE2
        run: |
          cd pcre2-10.44
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export PATH=$TOOLCHAIN/bin:$PATH
          export CC=aarch64-linux-android34-clang
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          ./configure --host=aarch64-linux-android --prefix=$GITHUB_WORKSPACE/deps-install \
            --disable-shared --enable-static \
            CFLAGS="-O2 -static -fPIE -Wl,-z,max-page-size=16384" \
            LDFLAGS="-static -Wl,-z,max-page-size=16384"
          make -j$(nproc)
          make install

      - name: Build Static Git
        run: |
          cd git-2.47.1
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export PATH=$TOOLCHAIN/bin:$PATH

          # Patch out sysinfo and sync_file_range from uname config for Android seccomp safety
          sed -i '/HAVE_SYSINFO/d' config.mak.uname
          sed -i '/HAVE_SYNC_FILE_RANGE/d' config.mak.uname

          # Patch compatibility header for Android Bionic pthread cancellation omission
          printf '\n#ifndef PTHREAD_CANCEL_DISABLE\n#define PTHREAD_CANCEL_DISABLE 0\n#define PTHREAD_CANCEL_ENABLE 1\n#define pthread_setcancelstate(s, o) (0)\n#endif\n' >> git-compat-util.h

          # Build git binary
          make -j$(nproc) git \
            CC=aarch64-linux-android34-clang \
            AR=llvm-ar \
            CFLAGS="-O2 -static -fPIE -I. -I$GITHUB_WORKSPACE/deps-install/include -DNO_PTHREADS -D__ANDROID__" \
            LDFLAGS="-static -Wl,-z,max-page-size=16384 -L$GITHUB_WORKSPACE/deps-install/lib" \
            USE_LIBPCRE2=1 \
            LIBPCRE2_PATH=$GITHUB_WORKSPACE/deps-install \
            NO_PTHREADS=1 \
            NO_GECOS_IN_PWENT=1 \
            NO_NSEC=1 \
            NO_REGEX=1 \
            NO_ICONV=1 \
            NO_GETTEXT=1 \
            NO_TCLTK=1 \
            NO_PYTHON=1 \
            NO_PERL=1 \
            NO_OPENSSL=1 \
            NO_CURL=1 \
            NO_SYS_POLL_H=1 \
            PTHREAD_LIBS="" \
            NEEDS_LIBICONV="" \
            NEEDS_LIBINTL="" \
            NEEDS_LIBGEN="" \
            NEEDS_LIBRESOLV=""

      - name: Package binary and verify
        run: |
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export PATH=$TOOLCHAIN/bin:$PATH
          mkdir -p output
          cp git-2.47.1/git output/
          file output/git
          readelf -l output/git | grep -A1 "LOAD" | grep -q "0x4000" || (echo "ERROR: missing 16KB alignment" && exit 1)
          readelf -l output/git | grep -q INTERP && (echo "ERROR: PT_INTERP found" && exit 1) || true
          readelf -l output/git
          llvm-strip output/git
          cd output
          tar -czvf git-arm64.tar.gz git

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidx-bionic-git-arm64
          path: output/git-arm64.tar.gz
